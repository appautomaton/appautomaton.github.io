<!DOCTYPE html>

<!-- Source for og-card.png. Render at exactly 1200x630 and screenshot; do not hand-edit the PNG. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1200">
<title>Setloom social card</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=supreme@400&amp;display=block">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=tabular@400&amp;display=block">
<style>
  /* The Setloom wordmark engraved on a five-line staff, with a lime playhead, on bone. The same staff as the page's hero, played to just past the t. */
  @font-face { font-family: "Outward Block"; src: url("assets/fonts/outward-block.woff2") format("woff2"); font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #ECEAE3; color: #111110; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; }
  .mark { --space: 0.175em; --rule: 3px; position: absolute; left: 72px; top: 104px; width: 1.067em; height: 0.7em; font: 400 580px/0.858 "Outward Block", sans-serif; }
  .staff, .played { position: absolute; top: 0; height: 0.7em; }
  .staff { left: -72px; width: calc(72px + 1.127em); background: repeating-linear-gradient(to bottom, #A9A69C 0 var(--rule), transparent var(--rule) var(--space)); height: calc(0.7em + var(--rule)); }
  .staff::after { content: ""; position: absolute; right: 0; top: 0; width: 22px; height: 100%; background: linear-gradient(to right, #A9A69C 0 3px, transparent 0 10px, #A9A69C 0); }
  .played { left: 0; width: 0.52em; height: calc(0.7em + 4px); top: -0.5px; background: repeating-linear-gradient(to bottom, #111110 0 5px, transparent 5px var(--space)); }
  .word { position: relative; display: block; height: 0.7em; white-space: nowrap; color: transparent;
    background-color: #111110; background-image: linear-gradient(to bottom, transparent calc(1 * var(--space) - var(--rule) / 2), #C6F135 0 calc(1 * var(--space) + var(--rule) / 2), transparent 0 calc(2 * var(--space) - var(--rule) / 2), #C6F135 0 calc(2 * var(--space) + var(--rule) / 2), transparent 0 calc(3 * var(--space) - var(--rule) / 2), #C6F135 0 calc(3 * var(--space) + var(--rule) / 2), transparent 0), linear-gradient(to bottom, transparent calc(1 * var(--space) - var(--rule) / 2), #ECEAE3 0 calc(1 * var(--space) + var(--rule) / 2), transparent 0 calc(2 * var(--space) - var(--rule) / 2), #ECEAE3 0 calc(2 * var(--space) + var(--rule) / 2), transparent 0 calc(3 * var(--space) - var(--rule) / 2), #ECEAE3 0 calc(3 * var(--space) + var(--rule) / 2), transparent 0); background-size: 0.52em 100%, 100% 100%; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text; }
  .head { position: absolute; left: calc(0.52em - 6px); top: -0.035em; width: 12px; height: 0.77em; background: #C6F135; box-shadow: 0 0 0 2px #111110; }
  .line { position: absolute; left: 784px; top: 300px; width: 352px; font: 400 30px/1.3 "Supreme", sans-serif; color: #3A3935; }
  .foot { position: absolute; left: 72px; right: 64px; bottom: 44px; display: flex; justify-content: space-between; font: 400 18px/1 "Tabular", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #62605A; }
  .foot b { font-weight: 400; color: #111110; }
</style>
</head>
<body>
<div class="card">
  <div class="mark"><span class="staff"></span><span class="played"></span><span class="word">Setloom</span><span class="head"></span></div>
  <p class="line">An open-source agentic music producer. You direct in plain language and judge by ear.</p>
  <p class="foot"><b>appautomaton.com/setloom</b><span>Open source · Apple Silicon</span></p>
</div>
</body>
</html>
