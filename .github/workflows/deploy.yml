name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 24, not 22: the prerender step imports the catalog straight from
      # TypeScript to check the rendered card count against it. Pinning the
      # runtime that strips types keeps that check running rather than
      # quietly degrading to a warning.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The build ends with a prerender pass that bakes the rendered page
      # into dist/index.html, so crawlers see real HTML.
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
