name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The catalog is read from the org at build time, so the site goes stale
  # whenever a project ships and nothing here is pushed. A daily rebuild is
  # what makes a new repository, a newly published page, or a rewritten
  # description reach the catalog and the sitemap without anyone doing it.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 reads the typed catalog directly. The site has no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check discovery helpers
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build and validate website artifacts
        id: build
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run build 2>&1 | tee build.log
          else
            npm run build:fresh 2>&1 | tee build.log
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize catalog checks
        if: always()
        run: node sites/home/scripts/report-build.mjs '${{ steps.build.outcome }}'

      - name: Save catalog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build-report
          path: |
            build.log
            build-report.json
            sites/home/src/data/catalog-state.json
            sites/home/src/data/org.generated.ts
            registry/sites.json
          retention-days: 30

      - name: Save the static preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          include-hidden-files: true
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          # Only explicitly staged or centrally owned modules enter production.
          path: dist-production

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
